<title>📢 원광복지몰</title>

<script>
function g(n){return new URL(location.href).searchParams.get(n)}

const FALLBACK = "https://www.3844gift.com/Default.asp";
const raw = g('u');
let TARGET = FALLBACK;
try{ if(raw) TARGET = decodeURIComponent(raw) }catch(e){}

const ua = navigator.userAgent || "";
const isKakaoInApp = /kakaotalk/i.test(ua);
const isBot = /facebookexternalhit|twitterbot|naver|bot|crawl|spider/i.test(ua);
const isKakaoScraper = /kakaotalk.*(scrap|bot)/i.test(ua);

window.addEventListener("DOMContentLoaded", function(){
    if(isBot || isKakaoScraper){
        return; // OG 수집 전용
    }
    if(isKakaoInApp){
        document.getElementById("guide").style.display="block";
        return; // 버튼 유도
    }
    setTimeout(function(){ location.replace(TARGET); }, 200);
});
</script>

<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#f5f5f5;}
.card{max-width:560px;width:92%;padding:24px;border-radius:20px;
background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center;}
img{max-width:100%;border-radius:14px;margin-bottom:16px;}
.button{display:inline-block;padding:14px 22px;border-radius:14px;
background:#111;color:#fff;text-decoration:none;font-weight:600;}
.guide-text{margin-bottom:14px;font-size:15px;color:#333;}
</style>
</head>

<body>
<div class="card">
<img src="thumb-20260227005017.png" alt="썸네일">
<div id="guide" style="display:none;">
<p class="guide-text">카카오톡 브라우저에서는 자동 이동이 제한됩니다.<br>아래 버튼을 눌러 상품 페이지로 이동해주세요.</p>
<a class="button" id="moveBtn" href="#">👉 상품 페이지로 이동</a>
</div>
</div>

<script>
document.getElementById("moveBtn").setAttribute("href", TARGET);
</script>

</body>
