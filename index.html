<title>📢 원광복지몰</title>
<script>
function g(n){return new URL(location.href).searchParams.get(n)}
const FALLBACK = "https://3844mall.com/mitem.php?item=261797";
const raw = g('u'); let TARGET = FALLBACK;
try{ if(raw) TARGET = decodeURIComponent(raw) }catch(e){}

const ua = navigator.userAgent.toLowerCase();
const isKakaoInApp = /kakaotalk/i.test(ua);
const isBot = /facebookexternalhit|twitterbot|naver|bot|crawl|spider/i.test(ua);
const isKakaoScraper = /kakaotalk.*(scrap|bot)/i.test(ua);

window.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('btn');
  if(btn) btn.href = TARGET;

  if(isBot || isKakaoScraper) return;

  if(isKakaoInApp) {
    document.getElementById('msg').innerText = "카카오톡에서는 아래 버튼을 눌러 이동해주세요.";
    return;
  }

  setTimeout(() => location.replace(TARGET), 200);
});
</script>

a.button{display:inline-block;padding:12px 18px;border-radius:12px;background:#111;color:#fff;text-decoration:none}

</style>

</div>
