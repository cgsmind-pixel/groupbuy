<meta property="og:image" content="https://cgsmind-pixel.github.io/groupbuy/thumb-20260707133724.png?v=20260707133724">

<meta name="twitter:card" content="summary_large_image">
<title>📢 원광복지몰</title>
<script>
  function g(n){return new URL(location.href).searchParams.get(n)}
  const FALLBACK = "https://3844mall.com/mitem.php?item=260074";
  const raw = g('u'); let TARGET = FALLBACK;
  try{ if(raw) TARGET = decodeURIComponent(raw) }catch(e){}
  const ua = navigator.userAgent;
  const isKakaoInApp = /kakaotalk/i.test(ua);
  const isBot = /facebookexternalhit|twitterbot|naver|bot|crawl|spider/i.test(ua);
  const isKakaoScraper = /kakaotalk.*(scrap|bot)/i.test(ua);
  window.addEventListener('DOMContentLoaded',()=>{
    const btn=document.getElementById('go'); btn.href=TARGET;
    if(isBot||isKakaoScraper) return;              // OG 수집 봇: 이동 없음
    if(isKakaoInApp){                               // 카톡 인앱: 버튼 유도
      document.getElementById('msg').textContent='아래 버튼을 눌러 상품 페이지로 이동하세요.';
      return;
    }
    setTimeout(()=>location.replace(TARGET),200);   // 일반 브라우저: 자동 이동
  });
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#fafafa}
  .card{max-width:560px;padding:24px;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.08);text-align:center}
  img{max-width:100%;border-radius:12px;margin:0 0 12px}
  a.button{display:inline-block;padding:14px 22px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <img src="thumb-20260707133724.png" alt="상품 썸네일">
    <p id="msg">잠시 후 상품 페이지로 이동합니다.</p>
    <a class="button" id="go" href="https://3844mall.com/mitem.php?item=260074">👉 상품 페이지로 이동</a>
  </div>
</body>
