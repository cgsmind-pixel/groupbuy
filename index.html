<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f7f7f7;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
.card{
  max-width:560px;
  background:#fff;
  padding:24px;
  border-radius:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
  text-align:center;
}
img{
  max-width:100%;
  border-radius:12px;
  margin-bottom:16px;
}
.button{
  display:inline-block;
  padding:14px 22px;
  border-radius:12px;
  background:#111;
  color:#fff;
  text-decoration:none;
  font-weight:700;
}
p{line-height:1.6}
</style>

<script>
function g(n){return new URL(location.href).searchParams.get(n)}

const FALLBACK = "https://3844mall.com/mitem.php?item=230875";
const raw = g('u');
let TARGET = FALLBACK;

try {
  if(raw) TARGET = decodeURIComponent(raw)
} catch(e) {}

const ua = navigator.userAgent || "";

const isKakaoInApp = /kakaotalk/i.test(ua);
const isBot = /facebookexternalhit|twitterbot|naver|bot|crawl|spider/i.test(ua);
const isKakaoScraper = /kakaotalk.*(scrap|bot)/i.test(ua);

if(!isBot && !isKakaoScraper && !isKakaoInApp){
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      location.replace(TARGET);
    }, 200);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('moveBtn');
  btn.href = TARGET;
});
</script>
</head>

    <p id="guide">

    </p>
    <a id="moveBtn" class="button" href="https://3844mall.com/mitem.php?item=230875">

    </a>
  </div>
