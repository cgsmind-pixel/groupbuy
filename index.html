<title>📢 원광복지몰</title>

<script>
function g(n){return new URL(location.href).searchParams.get(n)}

const FALLBACK = "https://3844mall.com/mitem.php?item=260037";
const raw = g('u');
let TARGET = FALLBACK;

try {
  if(raw) TARGET = decodeURIComponent(raw)
} catch(e) {}

const ua = navigator.userAgent;

const isKakaoInApp = /kakaotalk/i.test(ua);
const isBot = /facebookexternalhit|twitterbot|naver|bot|crawl|spider/i.test(ua);
const isKakaoScraper = /kakaotalk.*(scrap|bot)/i.test(ua);

window.addEventListener('DOMContentLoaded', () => {

  if(isBot || isKakaoScraper) {
    return;
  }

  const btn = document.getElementById('goBtn');
  btn.href = TARGET;

  if(isKakaoInApp) {
    document.getElementById('guide').style.display = 'block';
    return;
  }

  setTimeout(() => {
    location.replace(TARGET);
  }, 200);

});
</script>
