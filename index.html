<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="📢 원광복지몰">
<meta property="og:description" content="클릭하면 상품 구입페이지로 이동합니다.">
<meta property="og:image" content="https://cgsmind-pixel.github.io/groupbuy/thumb-20260514013143.png?v=20260514013143">
<meta property="og:image:secure_url" content="https://cgsmind-pixel.github.io/groupbuy/thumb-20260514013143.png?v=20260514013143">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>📢 원광복지몰</title>
<script>
  function g(n){return new URL(location.href).searchParams.get(n)}
  const FALLBACK = "https://3844mall.com/search.php?search_category=all&search_keyword=%5B%EA%B0%95%ED%9B%88%EB%AA%A9%EC%9E%A5%5D+%EC%88%98%EC%A0%9C%EC%9A%94%EA%B1%B0%ED%8A%B8+%EB%B8%94%EB%A3%A8%EB%B2%A0%EB%A6%AC+1000ml&x=29&y=34";
  const raw = g('u'); let TARGET = FALLBACK;
  try{ if(raw) TARGET = decodeURIComponent(raw) }catch(e){}

  const ua = navigator.userAgent || "";
  const isKakaoInApp = /kakaotalk/i.test(ua);
  const isBot = /facebookexternalhit|twitterbot|naver|bot|crawl|spider/i.test(ua);
  const isKakaoScraper = /kakaotalk.*(scrap|bot)/i.test(ua);

  if (!isBot && !isKakaoScraper && !isKakaoInApp) {
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => location.replace(TARGET), 200);
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('moveBtn');
    btn.href = TARGET;

    if (isKakaoInApp) {
      document.getElementById('guide').style.display = 'block';
    }
  });
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f7;font-family:system-ui,-apple-system,Segoe UI,Roboto}
  .card{max-width:560px;padding:24px;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.08);text-align:center}
  img{max-width:100%;border-radius:12px;margin:0 0 12px}
  .guide{display:none;font-size:15px;color:#333;line-height:1.6;margin-bottom:16px}
  a.button{display:inline-block;padding:14px 22px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <img src="thumb-20260514013143.png" alt="썸네일">
    <p id="guide" class="guide">
      카카오톡에서는 자동 이동이 제한됩니다.<br>
      아래 버튼을 눌러 상품 페이지로 이동해주세요.
    </p>
    <a id="moveBtn" class="button" href="https://3844mall.com/search.php?search_category=all&search_keyword=%5B%EA%B0%95%ED%9B%88%EB%AA%A9%EC%9E%A5%5D+%EC%88%98%EC%A0%9C%EC%9A%94%EA%B1%B0%ED%8A%B8+%EB%B8%94%EB%A3%A8%EB%B2%A0%EB%A6%AC+1000ml&x=29&y=34">👉 상품 페이지로 이동</a>
  </div>
</body>
</html>
