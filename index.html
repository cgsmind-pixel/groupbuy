<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="📢 원광복지몰">
<meta property="og:description" content="클릭하면 상품 구입페이지로 이동합니다.">
<meta property="og:image" content="https://cgsmind-pixel.github.io/groupbuy/thumb-20260330014149.png?v=20260330014149">
<meta property="og:image:secure_url" content="https://cgsmind-pixel.github.io/groupbuy/thumb-20260330014149.png?v=20260330014149">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>📢 원광복지몰</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f7f7f8;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #111;
  }
  .wrap {
    width: 100%;
    padding: 24px;
    display: grid;
    place-items: center;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
    text-align: center;
  }
  img {
    width: 100%;
    height: auto;
    border-radius: 14px;
    display: block;
    margin: 0 0 14px;
  }
  p {
    margin: 0 0 14px;
    line-height: 1.6;
    word-break: keep-all;
  }
  .button {
    display: inline-block;
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    background: #111;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
  }
  .sub {
    margin-top: 10px;
    font-size: 13px;
    color: #666;
  }
</style>
<script>
  function g(n) { return new URL(location.href).searchParams.get(n); }

  const FALLBACK_URL = 'https://3844gift.com';
  const raw = g('u');
  let TARGET = FALLBACK_URL;

  try {
    if (raw) TARGET = decodeURIComponent(raw);
  } catch (e) {}

  const ua = navigator.userAgent || "";
  const isKakaoInApp = /kakaotalk/i.test(ua);
  const isBot = /facebookexternalhit|twitterbot|naver|bot|crawl|spider/i.test(ua);
  const isKakaoScraper = /kakaotalk.*(scrap|bot)/i.test(ua);

  document.addEventListener('DOMContentLoaded', function () {
    const btn = document.getElementById('moveBtn');
    const msg = document.getElementById('msg');
    btn.setAttribute('href', TARGET);

    if (isBot || isKakaoScraper) {
      msg.textContent = "미리보기 수집용 페이지입니다.";
      return;
    }

    if (isKakaoInApp) {
      msg.textContent = "카카오톡에서는 아래 버튼을 눌러 상품 페이지로 이동해주세요.";
      return;
    }

    msg.textContent = "잠시 후 상품 페이지로 자동 이동합니다.";
    setTimeout(function () {
      window.location.href = TARGET;
    }, 200);
  });
</script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img src="thumb-20260330014149.png" alt="썸네일">
      <p id="msg">페이지를 준비하고 있습니다.</p>
      <a id="moveBtn" class="button" href="https://3844gift.com">👉 상품 페이지로 이동</a>
      <div class="sub">자동 이동이 되지 않으면 버튼을 눌러주세요.</div>
    </div>
  </div>
</body>
</html>
